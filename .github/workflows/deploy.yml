name: Copy Webflow site to GitHub Pages

on:
  workflow_dispatch:        # runs only from the "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Copy the published Webflow site
        env:
          SOURCE_URL: https://swiftevents-dev.webflow.io
          TARGET_URL: https://swiftevents.dev
          OUT_DIR: site
        run: python scripts/mirror.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
